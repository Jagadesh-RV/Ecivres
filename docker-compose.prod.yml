version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecivres-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecivres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecivres_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecivres_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecivres-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_prod_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: ecivres-api-prod
    restart: always
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecivres_admin}:${POSTGRES_PASSWORD:-secure_prod_password}@postgres:5432/${POSTGRES_DB:-ecivres_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_prod_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: ecivres-web-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:5001
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ecivres-worker-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecivres_admin}:${POSTGRES_PASSWORD:-secure_prod_password}@postgres:5432/${POSTGRES_DB:-ecivres_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_prod_password}
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: ecivres-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_prod_data:
  redis_prod_data:
