apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bullmq-worker-scaler
  namespace: ecivres-prod
spec:
  scaleTargetRef:
    name: ecivres-worker
  minReplicaCount: 2
  maxReplicaCount: 30
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        port: "6379"
        listLength: "10"
        enableTLS: "true"
