apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecivres-api
  namespace: production
  labels:
    app: ecivres-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ecivres-api
  template:
    metadata:
      labels:
        app: ecivres-api
    spec:
      containers:
        - name: api
          image: ecivres/api:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: ecivres-config
            - secretRef:
                name: ecivres-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ecivres-api-service
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: ecivres-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecivres-api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecivres-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecivres-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.ecivres.com
        - app.ecivres.com
      secretName: ecivres-tls-cert
  rules:
    - host: api.ecivres.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecivres-api-service
                port:
                  number: 3001
