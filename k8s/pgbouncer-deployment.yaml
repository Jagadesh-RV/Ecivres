apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: production
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.20.0
          env:
            - name: DB_HOST
              value: "ecivres-postgres-production.c1234.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "ecivres_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecivres-secrets
                  key: DB_PASSWORD
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "10000"
            - name: DEFAULT_POOL_SIZE
              value: "100"
          ports:
            - containerPort: 6432
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-service
  namespace: production
spec:
  ports:
    - port: 6432
      targetPort: 6432
  selector:
    app: pgbouncer
