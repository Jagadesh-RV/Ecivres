name: EcivreS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  verify:
    name: Lint, Typecheck & Test Verification Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint Verification Gate
        run: pnpm lint

      - name: TypeScript Typecheck Gate
        run: pnpm typecheck

      - name: API Unit Test Suite Gate
        run: pnpm --filter api test

      - name: Next.js Production Build Gate
        run: pnpm --filter web build
