name: EcivreS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Test Verification Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint Verification Gate
        run: pnpm lint

      - name: TypeScript Typecheck Gate
        run: pnpm typecheck

      - name: API Unit Test Suite Gate
        run: pnpm --filter api test

      - name: Next.js Production Build Gate
        run: pnpm --filter web build

  deploy-dev:
    name: Development Deployment
    needs: verify
    if: github.ref == 'refs/heads/develop'
    environment: development
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Development Environment
        run: echo "Successfully deployed to Development"

  deploy-prod:
    name: Production Deployment (Approval Required)
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Environment
        run: echo "Successfully deployed to Production after manual approval gate"
