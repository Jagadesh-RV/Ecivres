name: EcivreS Production Release Pipeline

on:
  push:
    branches:
      - main
      - release/*

jobs:
  quality-gate:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

  build-and-deploy:
    name: Docker Build, Security Scan & EKS Deploy
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/ecivres-api:${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/ecivres-api:${{ github.sha }}

      - name: Deploy Helm Chart to Amazon EKS
        run: |
          aws eks update-kubeconfig --name ecivres-eks-production --region us-east-1
          helm upgrade --install ecivres ./helm/ecivres --namespace production --set image.tag=${{ github.sha }}
