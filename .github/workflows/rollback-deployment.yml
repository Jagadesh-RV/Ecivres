name: Emergency Deployment Rollback

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Helm release revision to rollback to (default 0 = previous)'
        required: false
        default: '0'

jobs:
  rollback:
    name: Rollback EKS Kubernetes Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Execute Helm Rollback
        run: |
          aws eks update-kubeconfig --name ecivres-eks-production --region us-east-1
          helm rollback ecivres ${{ github.event.inputs.revision }} --namespace production
